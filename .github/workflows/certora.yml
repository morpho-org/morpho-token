name: Certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        conf:
          - DelegationEthereum
          - DelegationOptimism
          - ERC20InvariantsEthereum
          - ERC20Ethereum
          - ERC20InvariantsOptimism
          - ERC20Optimism
          - ExternalCallsEthereum
          - ExternalCallsOptimism
          - MintBurnEthereum
          - MintBurnOptimism
          - RevertsERC20Ethereum
          - RevertsERC20Optimism
          - RevertsMintBurnEthereum
          - RevertsMintBurnOptimism

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.15.2"

      - name: Install certora
        run: pip install certora-cli

      - name: Install solc (0.8.27)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.27/solc-static-linux
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.27

      - name: Apply munging
        run: make -C certora munged

      - name: Verify ${{ matrix.conf }} specification
        run: certoraRun certora/confs/${{ matrix.conf }}.conf
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}

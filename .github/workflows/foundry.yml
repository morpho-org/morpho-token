name: Foundry

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Solidity lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - name: Prepare verification harness imports
        run: make -C certora munged
      - name: Lint contracts and verification harnesses
        run: forge lint src script certora --deny notes
      - name: Lint tests
        run: FOUNDRY_PROFILE=lint-test forge lint test --deny notes

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Check foundry.lock matches submodule pins
        run: forge build --locked

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
        env:
          ALCHEMY_KEY: ${{ secrets.PROTOCOL_ALCHEMY_KEY }}

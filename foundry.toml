[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 999999
evm_version = "cancun"

[profile.default.fuzz]
runs = 256

[profile.default.fmt]
wrap_comments = true

# Lint test/ as ordinary Solidity instead of applying Forge's test-only rule filter.
[profile.lint-test]
test = ".forge-lint-unused"

[profile.lint-test.lint]
# Lists replace the source exclusions; retain those and allow existing fixture patterns.
exclude_lints = [
    "erc20-unchecked-transfer",
    "unused-import",
    "unaliased-plain-import",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "screaming-snake-case-immutable",
    "block-timestamp",
    "reentrancy-events",
    "unused-return",
    "calls-loop",
    "empty-block",
]

[lint]
exclude_lints = [
    "erc20-unchecked-transfer",
    "unused-import",
    "unaliased-plain-import",
    "unwrapped-modifier-logic",
    "mixed-case-variable",
    "screaming-snake-case-immutable",
    # Existing implementation baseline; enabling CI must preserve audited bytecode.
    "block-timestamp",
    "reentrancy-events",
]

[rpc_endpoints]
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

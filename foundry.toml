[profile.default]
ignored_error_codes_from = [["test", ["code-size", "init-code-size"]]]
ignored_warnings_from = ["lib"]
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 999999
evm_version = "cancun"

[profile.default.fuzz]
runs = 1024

[lint]
severity = ["high", "medium", "low", "info"]
exclude_lints = [
    "arbitrary-send-erc20",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "cyclomatic-complexity",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "require-revert-in-loop",
    "screaming-snake-case-immutable",
    "too-many-digits",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unused-return",
    # Those exclusions are added to not add inline lint suppressors in the following contracts: Wrapper.
    "erc20-unchecked-transfer",
]

[rpc_endpoints]
ethereum = "https://rpc.morpho.dev/cache/evm/1?secret=${MORPHO_RPC_KEY}&skip-consensus=true"
base = "https://rpc.morpho.dev/cache/evm/8453?secret=${MORPHO_RPC_KEY}&skip-consensus=true"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
